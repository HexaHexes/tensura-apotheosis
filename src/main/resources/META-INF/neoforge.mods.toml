modLoader = "javafml"
loaderVersion = "[4,)"
license = "GNU Lesser General Public License v2.1"

[[mods]]
modId = "tensura_apotheosis"
version = "${mod_version}"
displayName = "Tensura Apotheosis"
authors = "kurok"
description = '''
Tensura-themed Apotheosis content pack: affixes and socket gems delivered as
pure datapack data (Placebo dynamic registries) - no mixins, no gameplay code.

- 51 affixes across melee, ranged, armor, shield, breaker and generic slots,
  using Tensura elements, dodge suite, magicule/aura economy and Tensura mob
  effects (frost, infection, severance, petrification, ...) as proc lines.
- 14 socket gems (8 core + 5 unique dragonscale/spirit/holy + ultima) with
  cracked-to-perfect purity scaling over Tensura and Apothic attributes.
- Gem models resolve through Apotheosis' hardcoded model namespace, so gem
  model JSONs ship under assets/apotheosis/models/item/gems/ while textures
  and lang stay in this mod's own namespace.
'''

[modproperties.tensura_apotheosis]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

